name: Build and Deploy to Cloud Run

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'casa-ahun' }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: ahun-members-service-repo
  SERVICE_NAME: ahun-members-service

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 - analyse Conventional Commits, cut a release, resolve version
  # -------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      published: ${{ steps.semantic.outputs.new_release_published }}
      have_gcp: ${{ steps.gcp.outputs.have_gcp }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report resolved release
        run: |
          echo "published = ${{ steps.semantic.outputs.new_release_published }}"
          echo "version   = ${{ steps.semantic.outputs.new_release_version }}"

      - name: Detect GCP secrets
        id: gcp
        run: |
          echo "have_gcp=${{ secrets.GCP_SA_KEY != '' || secrets.GOOGLE_CREDENTIALS != '' || secrets.GCP_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Stage 2 - run the test suite
  # -------------------------------------------------------------------------
  test:
    name: Test
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Test Suite
        run: ./gradlew test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.release.outputs.version }}

  # -------------------------------------------------------------------------
  # Stage 3 - build the container image and push it to Artifact Registry
  # -------------------------------------------------------------------------
  image:
    name: Build & Push Image
    needs: [release, test]
    if: needs.release.outputs.published == 'true' && needs.release.outputs.have_gcp == 'true'
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.release.outputs.version }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Stage 4 - deploy the image to Cloud Run
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    needs: [release, image]
    if: needs.release.outputs.published == 'true' && needs.release.outputs.have_gcp == 'true'
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.release.outputs.version }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet
