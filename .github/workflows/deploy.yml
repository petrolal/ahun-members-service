name: Build and Deploy to Cloud Run

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0 - leave empty to use tag/default)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'casa-ahun' }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: ahun-members-service-repo
  SERVICE_NAME: ahun-members-service
  HAVE_GCP_SECRETS: ${{ secrets.GCP_SA_KEY != '' || secrets.GOOGLE_CREDENTIALS != '' || secrets.GCP_CREDENTIALS != '' }}

jobs:
  test-build-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Determine Build Version
      - name: Determine Build Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.${{ github.run_number }}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "Build version set to: ${VER}"

      # 3. Set up Java JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      # 4. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run tests
      - name: Run Test Suite
        run: ./gradlew test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION: ${{ env.VERSION }}

      # 6. Publish Package to GitHub Packages
      - name: Publish Package to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION: ${{ env.VERSION }}

      # 7. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}

      # 8. Set up Cloud SDK
      - name: Set up Cloud SDK
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      # 9. Configure Docker to use Artifact Registry credentials
      - name: Configure Docker
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 10. Set up Docker Buildx (for building images efficiently)
      - name: Set up Docker Buildx
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        uses: docker/setup-buildx-action@v3

      # 11. Build and Push Container Image
      - name: Build and Push Container Image
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ env.VERSION }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 12. Deploy container to Google Cloud Run
      - name: Deploy to Cloud Run
        if: ${{ env.HAVE_GCP_SECRETS == 'true' }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ env.VERSION }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet
