server:
  forward-headers-strategy: framework

spring:
  devtools:
    restart:
      enabled: false

  application:
    name: ahun-members-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      schema: members

  flyway:
    schemas: members
    default-schema: members
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: members

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}

google:
  credentials: ${GOOGLE_CREDENTIALS:DEFAULT_GCP}

petrolal:
  commons:
    web:
      swagger:
        title: Ahun Members Service
        description: Service to manage members
        version: "1.0"
